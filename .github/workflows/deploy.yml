name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Avoid overlapping deploys of the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (static export to out/)
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: site-out
          path: out/
          retention-days: 1

  deploy:
    name: Deploy to production
    needs: build
    runs-on: ubuntu-latest
    # Only deploy on pushes to main (not PRs or manual runs against other refs).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: site-out
          path: out

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy over SSH/rsync
        env:
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USERNAME: ${{ secrets.DEPLOY_USERNAME }}
        run: |
          set -euo pipefail

          SSH_OPTS="-o UserKnownHostsFile=$GITHUB_WORKSPACE/.github/deploy/known_hosts -o StrictHostKeyChecking=yes -o PreferredAuthentications=password -o PubkeyAuthentication=no -o ConnectTimeout=30"

          # The web root also hosts GoDaddy/WordPress platform files that this
          # repo doesn't manage (wp-*, xmlrpc.php, .htaccess, robots.txt, etc.).
          # Exclude them so --delete only prunes stale files that this repo's
          # own build previously produced.
          rsync -avz --delete \
            --exclude=".*" \
            --exclude="wp-*" \
            --exclude="xmlrpc.php" \
            --exclude="platform" \
            --exclude="license.txt" \
            --exclude="robots.txt" \
            --exclude="source-wp-config.php" \
            --exclude="gd-preload-cli.php" \
            --exclude="plat-cron.php" \
            --exclude="index.php" \
            -e "sshpass -e ssh $SSH_OPTS" \
            out/ "$DEPLOY_USERNAME@$DEPLOY_HOST:html/"
